<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Climate+Crisis:YEAR@1979&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Black Ops One", system-ui;
            font-weight: 400;
            font-style: normal;
            text-align: center;
            padding-top: 20vh;
            background-color: black;
            color: white;
            background-image: url('./flower.jpg');
            background-size: auto 100vh;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
            background-position: 0 0;
            
            /* Define our height and width variables */
            --w: 100vw;
            --h: 100vh;
            width: var(--w);
            height: var(--h);
        }

        /* Apply the logic when 1.2 * width < height */
        @media (max-aspect-ratio: 5/4) {
          body {
            /* x = height - 1.2 * width */
            --x: calc(var(--h) - (0.8 * var(--w)));
            
            /* Set position to -x, 0 */
            background-position: calc(-0.7 * var(--x)) 0;
          }
        }
        .time-value {
            font-size: 3rem;
            display: block;
            font-weight: bold;
        }
        .label {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: block;
            text-transform: uppercase;
        }
        #message {
            display: none;
            font-size: 4rem;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="timer-container">
        <span id="hours" class="time-value">00</span>
        <span class="label">hours</span>
        
        <span id="minutes" class="time-value">00</span>
        <span class="label">minutes</span>
        
        <span id="seconds" class="time-value">00</span>
        <span class="label">seconds</span>
        
        <p style="font-size: 1.5rem;">to go</p>
    </div>

    <div id="message">Do not disturb</div>

    <script>
        // Target: April 28, 2026, 12:00:00 GMT+6
        // We define the target in UTC then adjust for the +6 offset
        const targetDate = new Date('2026-04-26T12:00:00+06:00').getTime();

        const updateTimer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // If the count down is finished
            if (distance < 0) {
                clearInterval(updateTimer);
                document.getElementById("timer-container").style.display = "none";
                document.getElementById("message").style.display = "block";
                return;
            }

            // Time calculations for hours, minutes and seconds
            // Note: Math.floor(distance / 3600000) gives total hours remaining
            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the results
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
